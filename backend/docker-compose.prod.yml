# docker-compose.prod.yml — ObraFlow Produção
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Antes de usar:
#   1. Copiar .env.example → .env.production e preencher todas as variáveis
#   2. Gerar SECRET_KEY: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
#   3. Colocar certificados SSL em infra/nginx/ssl/ (fullchain.pem + privkey.pem)
#   4. Configurar DOMAIN_NAME no .env.production ou no nginx.conf

x-backend-prod: &backend-prod
  build:
    context: .
    target: prod
  env_file: .env.production
  restart: always
  volumes:
    - backend_logs:/app/logs
    - backend_media:/app/media
    - backend_static:/app/static
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: obraflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/app/static:ro
      - backend_media:/app/media:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  # ─── Backend Gunicorn ────────────────────────────────────────────────────────
  backend:
    <<: *backend-prod
    container_name: obraflow_backend
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --worker-class gthread
        --threads 4
        --timeout 120
        --access-logfile -
        --error-logfile -
        --log-level info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Celery worker ──────────────────────────────────────────────────────────
  celery:
    <<: *backend-prod
    container_name: obraflow_celery
    command: >
      celery -A config.celery worker
        --loglevel=info
        --concurrency=4
        -Q default,cobrancas,notificacoes,fiscal,relatorios
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ─── Celery beat ─────────────────────────────────────────────────────────────
  celery-beat:
    <<: *backend-prod
    container_name: obraflow_celery_beat
    command: >
      celery -A config.celery beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: obraflow_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-obraflow}
      POSTGRES_USER: ${DB_USER:-obraflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-obraflow} -d ${DB_NAME:-obraflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: obraflow_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ─── Backup agendado (cron) ──────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: obraflow_backup
    restart: always
    env_file: .env.production
    volumes:
      - ./scripts/backup_postgres.sh:/backup.sh:ro
      - backup_data:/app/backups
    entrypoint: >
      sh -c "
        echo '0 3 * * * /backup.sh >> /app/backups/backup.log 2>&1' | crontab - &&
        crond -f
      "
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_media:
  backend_static:
  backup_data:
  certbot_www:
